name: Build YoroOS Desktop ISO (Linux)

# Builds the Debian Live desktop ISO (Plasma + Yoro apps)
# inside a Debian container on the GitHub runner and stores it as an
# artifact. Takes a while (large download of Debian packages).
on:
  workflow_dispatch:
  push:
    branches:
      - "arena/935b4efd-yoroos"
    tags:
      - "desktop-*-dev*"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scripts and desktop configuration
        run: |
          bash -n distro/build-iso.sh distro/scripts/qemu-live-smoke.sh
          python3 -m unittest discover -s tests -p 'test_desktop_branding.py' -v
          python3 -m unittest discover -s tests -p 'test_build_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_fileops.py' -v
          python3 -m py_compile desktop/yoroapps/*.py desktop/matronix-browser/matronix.py

      - name: Test application windows with Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyqt6 python3-pyqt6.qtmultimedia
          QT_QPA_PLATFORM=offscreen /usr/bin/python3 -m unittest discover -s tests -p 'test_qt_ui.py' -v

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Fetch selected icon and cursor themes
        run: |
          set -euxo pipefail
          mkdir -p .themes/colloid
          curl -fL --retry 3 https://codeload.github.com/vinceliuice/Colloid-icon-theme/tar.gz/ceac6608ecd0e40025cbc2ebbd32bf0e0f4ebc6a | tar xz --strip-components=1 -C .themes/colloid
          curl -fL --retry 3 -o .themes/bibata.tar.xz https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice.tar.xz
          tar xJf .themes/bibata.tar.xz -C .themes
          test -f .themes/Bibata-Modern-Ice/index.theme
          curl -fL --retry 3 https://raw.githubusercontent.com/ful1e5/Bibata_Cursor/ddb09273cde49faeb6a32282660ff4293f52d6e0/LICENSE -o .themes/bibata-license.txt

      - name: Build ISO in Debian (trixie) container
        run: |
          set -o pipefail
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work -e YORO_THEME_INPUT_DIR=/work/.themes \
            debian:trixie bash -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debian-archive-keyring xorriso squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin ca-certificates gtk-update-icon-cache
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                shim-signed grub-efi-amd64-signed syslinux isolinux || \
                echo "optional bootloader packages unavailable, continuing"
              bash -x ./distro/build-iso.sh out
            ' 2>&1 | tee build.log

      - name: Install QEMU and UEFI firmware for a basic boot test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf tesseract-ocr xorriso

      - name: UEFI live boot smoke test
        run: |
          set -o pipefail
          sudo bash distro/scripts/qemu-live-smoke.sh out/yoroos-desktop-amd64.iso out/uefi-serial.log 2>&1 | sudo tee out/uefi-smoke.log

      - name: Verify Live user and Plasma session
        run: |
          set -o pipefail
          sudo xorriso -osirrox on -indev out/yoroos-desktop-amd64.iso -extract /live out/live
          sudo python3 distro/scripts/debug-live-login.py out --expect-desktop --expect-browser 2>&1 | sudo tee out/login-debug.txt

      - name: Post diagnostics (annotations + commit comment)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "E: |Unable|error|Error|failed|Failed|not found|denied|No such|Permission" build.log \
            | tail -n 10 | sed 's/%/%25/g' \
            | while IFS= read -r l; do echo "::error::$l"; done || true
          tail -n 5 build.log | sed 's/%/%25/g' \
            | while IFS= read -r l; do echo "::notice::TAIL: $l"; done || true
          { echo "Build log tail (run ${GITHUB_RUN_ID})"; echo; echo '```';
            tail -n 100 build.log || true; echo '```';
            if [ -f out/uefi-serial.log ]; then
              echo; echo 'UEFI smoke test serial tail:'; echo '```';
              tail -n 50 out/uefi-serial.log || true; echo '```';
              echo; echo 'UEFI smoke diagnostic:'; echo '```';
              cat out/uefi-smoke.log || true; echo '```';
            fi;
            if [ -f out/login-debug.txt ]; then
              echo; echo 'Live session diagnostics:'; echo '```';
              tail -n 90 out/login-debug.txt || true; echo '```';
            fi; } > comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@comment.md || true

      - name: Upload ISO artifact
        if: always() && hashFiles('out/yoroos-desktop-amd64.iso') != ''
        uses: actions/upload-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          path: |
            out/yoroos-desktop-amd64.iso
            out/yoroos-desktop-amd64.iso.sha256
            out/uefi-serial.log
            out/uefi-smoke.log
            out/login-debug.txt
            out/uefi-serial.log.ppm
          if-no-files-found: error
