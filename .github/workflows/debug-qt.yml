name: Debug Yoro Qt windows
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/debug-qt.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run GUI tests with timeout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyqt6 python3-pyqt6.qtmultimedia
          set -o pipefail
          QT_QPA_PLATFORM=offscreen timeout 90 /usr/bin/python3 -m unittest discover -s tests -p 'test_qt_ui.py' -v 2>&1 | tee qt.log
      - name: Record output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Qt tests'; echo '```'; cat qt.log || true; echo '```'; } > qt-comment.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@qt-comment.md || true
