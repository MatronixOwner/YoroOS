name: Debug Yoro Qt windows
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/debug-qt.yml', 'tests/capture_files.py']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run GUI tests with timeout
        run: |
          set -o pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work -e QT_QPA_PLATFORM=offscreen debian:trixie bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-pyqt6 python3-pyqt6.qtmultimedia qt6-svg-plugins breeze-icon-theme fonts-noto-core
            dpkg -L breeze-icon-theme | grep -E "index.theme|folder.svg" | head -40 || true
            /usr/bin/python3 -c "from PyQt6.QtWidgets import QApplication; from PyQt6.QtGui import QIcon; app=QApplication([]); print(QIcon.themeSearchPaths(), QIcon.themeName()); QIcon.setThemeName("breeze"); print(QIcon.fromTheme("folder").isNull())"
            timeout -k 5 90 /usr/bin/python3 -m unittest discover -s tests -p "test_qt_ui.py" -v
            /usr/bin/python3 tests/capture_files.py
          ' 2>&1 | tee qt.log
      - name: Record output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Qt tests'; echo '```'; cat qt.log || true; echo '```'; } > qt-comment.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@qt-comment.md || true

      - name: Record compressed preview for inspection
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,pathlib; b=pathlib.Path("files-preview.jpg").read_bytes(); assert len(b)<45000; pathlib.Path("preview-comment.md").write_text("Yoro preview (test data):\n```base64\n"+base64.b64encode(b).decode()+"\n```")'
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@preview-comment.md
