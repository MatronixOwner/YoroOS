name: Diagnose Matronix upstream style
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/debug-browser.yml']
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: '43066100338'
          github-token: ${{ github.token }}
          path: out
      - name: Diagnose session and browser
        run: |
          set -o pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work debian:trixie bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf xorriso python3
            xorriso -osirrox on -indev out/yoroos-desktop-amd64.iso -extract /live out/live
            python3 distro/scripts/debug-live-login.py out --expect-desktop --expect-browser
          ' 2>&1 | tee diagnosis.log
      - name: Record output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Desktop diagnosis'; echo '```'; tail -n 150 diagnosis.log; echo '```'; } > diagnostic-comment.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@diagnostic-comment.md || true
