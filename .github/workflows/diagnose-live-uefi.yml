name: Diagnose previously built Live ISO
on:
  push:
    branches: ["arena/935b4efd-yoroos"]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download themed ISO from diagnostic build
        uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: 43007725766
          github-token: ${{ github.token }}
          path: out
      - name: Install diagnostic tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf tesseract-ocr xorriso
      - name: Inspect ISO and boot with screenshot diagnostics
        run: |
          set -o pipefail
          sha256sum -c out/yoroos-desktop-amd64.iso.sha256 2>&1 || (cd out && sha256sum -c yoroos-desktop-amd64.iso.sha256)
          xorriso -osirrox on -indev out/yoroos-desktop-amd64.iso -extract /boot/grub/grub.cfg out/grub.cfg 2>&1 || true
          cat out/grub.cfg 2>/dev/null || true
          bash distro/scripts/qemu-live-smoke.sh out/yoroos-desktop-amd64.iso out/diagnostic.log 2>&1 | tee out/diagnostic-output.log
      - name: Record diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Live ISO diagnostic'; echo '```'; cat out/grub.cfg 2>/dev/null || true; cat out/diagnostic-output.log 2>/dev/null || true; echo '```'; } > diagnostic-comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@diagnostic-comment.md
