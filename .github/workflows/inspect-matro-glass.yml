name: Inspect MatroOS glass
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/inspect-matro-glass.yml']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: 43453933084
          github-token: ${{ github.token }}
          path: checked
      - uses: actions/upload-artifact@v4
        with:
          name: glass-preview
          path: checked/glass-screen.ppm
          if-no-files-found: error
