name: Inspect Linox desktop and Yoro boot
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/inspect-linox.yml']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: '43419416000'
          github-token: ${{ github.token }}
          path: out
      - name: Share boot and desktop screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work debian:trixie bash -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3-pil
            python3 -c "from PIL import Image; import base64,pathlib; p=pathlib.Path(\"out\"); [(lambda i,src: (i.thumbnail((900,600)), i.save(str(p / (src+\".jpg\")), quality=55)))(Image.open(p/(src+\".ppm\")),src) for src in (\"boot-screen\",\"uefi-serial.log\")]; [(lambda b,src: pathlib.Path(src+\".md\").write_text(src+\"\\n\`\`\`base64\\n\"+base64.b64encode(b).decode()+\"\\n\`\`\`\"))((p/(src+\".jpg\")).read_bytes(),src) for src in (\"boot-screen\",\"uefi-serial.log\")]"
          '
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@boot-screen.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@uefi-serial.log.md
