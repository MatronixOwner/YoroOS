name: Investigate Live login
on:
  push:
    branches: ["arena/935b4efd-yoroos"]
    paths:
      - '.github/workflows/debug-live-login.yml'
      - 'distro/scripts/debug-live-login.py'
permissions:
  contents: write
  actions: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: 43011702602
          github-token: ${{ github.token }}
          path: out
      - name: Install QEMU and extract kernel
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 xorriso squashfs-tools
          xorriso -osirrox on -indev out/yoroos-desktop-amd64.iso -extract /live out/live
          unsquashfs -cat out/live/filesystem.squashfs lib/live/config/0030-user-setup > out/user-setup.txt || true
          unsquashfs -cat out/live/filesystem.squashfs lib/live/config/1160-sddm > out/live-sddm.txt || true
      - name: Check booted system session
        run: |
          set -o pipefail
          python3 distro/scripts/debug-live-login.py out 2>&1 | tee out/login-debug.txt
      - name: Record findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Live login diagnosis:'; echo '```'; cat out/login-debug.txt out/user-setup.txt out/live-sddm.txt 2>/dev/null || true; echo '```'; } > comment.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@comment.md
