name: Publish YoroOS Desktop pre-release

# Triggered by tags like desktop-1.0-pre1.
# Takes the ISO built by a previous successful "Build YoroOS Desktop ISO"
# run (RUN_ID below — update it for the next pre-release) and publishes
# it as a GitHub pre-release with the ISO attached for direct download.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful desktop build run ID at the same commit as this ref"
        required: true
        type: string
      release_tag:
        description: "Existing release tag pointing at the same commit"
        required: true
        type: string

permissions:
  contents: write   # create the release
  actions: read     # download the artifact from the build run

env:
  BUILD_RUN_ID: ${{ inputs.build_run_id }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build run and tag match the checked out commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN_ID" --json headSha,conclusion,workflowName > run.json
          test "$(jq -r .headSha run.json)" = "$GITHUB_SHA"
          test "$(jq -r .conclusion run.json)" = success
          test "$(jq -r .workflowName run.json)" = 'Build YoroOS Desktop ISO (Linux)'
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"

      - name: Download ISO from build run
        uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: release-files

      - name: Prepare release files
        run: |
          ver="${RELEASE_TAG#desktop-}"          # 1.0-pre1
          mv release-files/yoroos-desktop-amd64.iso \
             "release-files/yoroos-desktop-${ver}-amd64.iso"
          rm -f release-files/yoroos-desktop-amd64.iso.sha256
          (cd release-files && sha256sum *.iso > SHA256SUMS.txt)
          ls -lh release-files

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${RELEASE_TAG#desktop-}"
          notes="distro/release-notes-${ver}.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" \
              release-files/*.iso release-files/SHA256SUMS.txt \
              --prerelease \
              --title "YoroOS Desktop ${ver} (Pre-release)" \
              --notes-file "$notes" \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              release-files/*.iso release-files/SHA256SUMS.txt \
              --prerelease \
              --title "YoroOS Desktop ${ver} (Pre-release)" \
              --generate-notes \
              --verify-tag
          fi
