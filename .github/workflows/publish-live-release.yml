name: Publish verified YoroOS Live image
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/publish-live-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '43411581445'
      BUILD_SHA: '947fe759c0e9dde645e3d662f0e97952cb564e9e'
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested build
        run: |
          set -euxo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha and .conclusion == "success"' run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" > jobs.json
          jq -e '[.jobs[] | .steps[] | select(.name == "Build ISO in Debian (trixie) container" or .name == "Verify UEFI, Live session and Matronix in QEMU" or .name == "Upload ISO artifact") | .conclusion] == ["success","success","success"]' jobs.json
      - uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: release-files
      - name: Verify checksum and upload release assets
        run: |
          set -euxo pipefail
          cd release-files
          sha256sum -c yoroos-desktop-amd64.iso.sha256
          mv yoroos-desktop-amd64.iso yoroos-debian13-live-947fe759c0e9-amd64.iso
          sha256sum yoroos-debian13-live-947fe759c0e9-amd64.iso > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload desktop-debian13-live-947fe759c0e9 yoroos-debian13-live-947fe759c0e9-amd64.iso SHA256SUMS.txt
