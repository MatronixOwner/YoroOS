name: Inspect Yoro window controls
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/inspect-window.yml']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: '43411581445'
          github-token: ${{ github.token }}
          path: out
      - name: Capture compressed preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work debian:trixie bash -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3-pil
            python3 -c "from PIL import Image; import base64,pathlib; i=Image.open(\"out/desktop-screen.ppm\"); i.thumbnail((900,600)); i.save(\"out/preview.jpg\", quality=55); b=pathlib.Path(\"out/preview.jpg\").read_bytes(); assert len(b)<45000; pathlib.Path(\"preview.md\").write_text(\"Window preview\\n\`\`\`base64\\n\"+base64.b64encode(b).decode()+\"\\n\`\`\`\")"
          '
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@preview.md
