name: Inspect Matronix Launcher Linux release
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/inspect-matronix-launcher.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect official Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o launcher.tar.gz https://github.com/MatronixOwner/MatronixLauncher/releases/download/v0.1.0-alpha.14/MatronixPrismLauncher-Linux-portable.tar.gz
          echo 'a5a987d4e970bd65e3e9a5612da53fca44b63eb6bdb1429810da0c9a97eedde7  launcher.tar.gz' | sha256sum -c
          mkdir portable
          tar xzf launcher.tar.gz -C portable
          find portable -maxdepth 3 -type f | sort | head -120 > report.txt
          du -h --max-depth=2 portable >> report.txt
          { echo 'Matronix portable package inspection'; echo '```'; cat report.txt; echo '```'; } > comment.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@comment.md
