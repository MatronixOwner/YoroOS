name: Publish verified MatroOS ISO
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/publish-matroos-iso.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '43457588118'
      BUILD_SHA: '255fddb99c7c389f55e10fa56f99dc5e6a7d15fa'
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested build
        run: |
          set -euxo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha and .conclusion == "success"' run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" > jobs.json
          jq -e '[.jobs[] | .steps[] | select(.name == "Build ISO in Debian (trixie) container" or .name == "Verify UEFI, Live session and Matronix in QEMU" or .name == "Upload ISO artifact") | .conclusion] == ["success","success","success"]' jobs.json
      - uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: release-files
      - name: Verify checksum and upload release assets
        run: |
          set -euxo pipefail
          cd release-files
          sha256sum -c yoroos-desktop-amd64.iso.sha256
          mv yoroos-desktop-amd64.iso matroos-live-255fddb99c7c-amd64.iso
          sha256sum matroos-live-255fddb99c7c-amd64.iso > SHA256SUMS.txt
          gh release upload matroos-live-255fddb99c7c matroos-live-255fddb99c7c-amd64.iso SHA256SUMS.txt
      - name: Export glass preview as Git blob
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pillow
          python3 - <<'PYIMAGE'
          from PIL import Image
          import base64, json
          from io import BytesIO
          img = Image.open('release-files/glass-screen.ppm')
          img.thumbnail((1000, 700))
          out = BytesIO(); img.convert('RGB').save(out, format='JPEG', quality=78, optimize=True)
          with open('blob.json', 'w') as f:
              json.dump({'content': base64.b64encode(out.getvalue()).decode(), 'encoding': 'base64'}, f)
          PYIMAGE
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input blob.json --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --method POST -f body="glass-preview-blob:$sha"
