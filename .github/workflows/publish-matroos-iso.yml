name: Publish verified MatroOS ISO
on:
  push:
    branches: ['arena/935b4efd-yoroos']
    paths: ['.github/workflows/publish-matroos-iso.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '43435581418'
      BUILD_SHA: '66861c28418dece345186a23b79291c94000c769'
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and individual QEMU checks
        run: |
          set -euxo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha and .status == "completed"' run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" > jobs.json
          jq -e '[.jobs[] | .steps[] | select(.name == "Build ISO in Debian (trixie) container" or .name == "Verify UEFI, Live session and Matronix in QEMU" or .name == "Upload ISO artifact") | .conclusion] == ["success","success","success"]' jobs.json
      - uses: actions/download-artifact@v4
        with:
          name: yoroos-desktop-amd64-iso
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: release-files
      - name: Verify checksum and upload
        run: |
          set -euxo pipefail
          cd release-files
          sha256sum -c yoroos-desktop-amd64.iso.sha256
          mv yoroos-desktop-amd64.iso matroos-live-66861c28418d-amd64.iso
          sha256sum matroos-live-66861c28418d-amd64.iso > SHA256SUMS.txt
          gh release upload matroos-live-66861c28418d matroos-live-66861c28418d-amd64.iso SHA256SUMS.txt
